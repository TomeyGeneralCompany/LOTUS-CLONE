name: Deterministic production-controller acceptance
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - '.github/workflows/real-model-acceptance.yml'
      - '.github/workflows/laptop-real-world-feedback.yml'
      - 'scripts/test-deterministic-lotus.ts'
      - 'scripts/test-deterministic-full-inventory.ts'
      - 'packages/security-solver/src/**'
jobs:
  deterministic-production-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LOCAL_MODEL_ADAPTER: deterministic
      LOCAL_MODEL_PROFILE: deterministic
      AUTOHACK_OLLAMA_URL: http://127.0.0.1:1/api/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify no model service is available to the controller
        run: |
          if curl -fsS --max-time 2 http://127.0.0.1:1/api/tags; then exit 1; fi
      - name: Deterministic production investigation and evidence review
        run: npx tsx scripts/test-deterministic-lotus.ts
      - name: Exhaustive inventory, stage gates and resume
        run: npx tsx scripts/test-deterministic-full-inventory.ts
