name: Zero-Qwen deterministic CPU smoke
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  pull_request:
    paths:
      - '.github/workflows/real-qwen-smoke.yml'
      - 'packages/security-solver/src/**'
      - 'scripts/test-deterministic-lotus.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LOCAL_MODEL_ADAPTER: deterministic
      LOCAL_MODEL_PROFILE: deterministic
      AUTOHACK_OLLAMA_URL: http://127.0.0.1:1/api/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run Qwen-free controller smoke and evidence tests
        run: npx tsx scripts/test-deterministic-lotus.ts
